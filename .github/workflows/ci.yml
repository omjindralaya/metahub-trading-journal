name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Windows-only dengan sengaja: identitas device memakai DPAPI dan TPM lewat
# crypt32/tbs (backend/device_key_*_windows.go), jadi runner Linux tidak akan
# meng-compile paket yang sebenarnya dikirim ke pengguna.
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: Verifikasi build rilis tidak menembak localhost
        shell: pwsh
        run: |
          # Bukan sekadar "apakah kompilasi jalan". Yang dijaga di sini adalah
          # kesalahan yang TIDAK membuat linker gagal: nama simbol -X yang salah
          # membuat binary keluar diam-diam tetap memakai localhost:8080.
          $out = "ci-check.exe"
          go build -trimpath -ldflags "-s -w -X trading-journal/backend.CloudAPIURL=https://ci.example/api/v1" -o $out .
          $ascii = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($out))
          if (-not $ascii.Contains("https://ci.example/api/v1")) {
            throw "Penyuntikan -X gagal: nama simbol backend.CloudAPIURL tidak lagi cocok."
          }
          Write-Host "OK: -X masih menyuntik backend.CloudAPIURL"
